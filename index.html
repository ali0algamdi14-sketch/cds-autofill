<section id="features">
  <h2 class="section-title" data-ar="مصمم لسير عمل الصيدلية الحقيقي" data-en="Built for practical pharmacy workflow"></h2>
  <p class="section-sub" data-ar="تساعد الإضافة في مهام إدخال البيانات المتكررة مع إبقاء الصيدلي متحكمًا في كل وصفة." data-en="The extension assists with repetitive data-entry tasks while keeping the pharmacist in control of every prescription."></p>
  <div class="grid">
    <div class="feature"><div class="iconbox">📋</div><h3 data-ar="تحليل الوصفة" data-en="Prescription parsing"></h3><p data-ar="يستخرج الحقول المدعومة للمريض والوصفة والطبيب والمنشأة والدواء من نص الوصفة الملصق." data-en="Extracts supported patient, prescription, physician, institution and medication fields from pasted prescription text."></p></div>
    <div class="feature"><div class="iconbox">🧠</div><h3 data-ar="المدة الذكية" data-en="Smart duration"></h3><p data-ar="يقارن المدة المكتوبة بحساب محلي يعتمد على الكمية والتركيز والجرعة والتكرار، ويحوّل التعارضات للمراجعة اليدوية." data-en="Compares written duration with a local calculation based on quantity, strength, dose and frequency. Conflicts are sent for manual review."></p></div>
    <div class="feature"><div class="iconbox">✅</div><h3 data-ar="مراجعة قبل التعبئة" data-en="Review before fill"></h3><p data-ar="تُعرض القيم المستخرجة للصيدلي قبل تعبئة الحقول المدعومة في CDS." data-en="Parsed values are shown to the pharmacist before supported CDS fields are populated."></p></div>
    <div class="feature"><div class="iconbox">🔒</div><h3 data-ar="معالجة محلية" data-en="Local processing"></h3><p data-ar="تُعالج بيانات المريض والوصفة محليًا داخل الإضافة ولا تُرسل إلى خادم خارجي لمعالجة الوصفات." data-en="Prescription and patient data are processed locally by the extension. They are not sent to an external prescription-processing server."></p></div>
    <div class="feature"><div class="iconbox">📊</div><h3 data-ar="سجلات وتصدير محلي" data-en="Local logs & export"></h3><p data-ar="يمكن أن تبقى سجلات الاستخدام المدعومة داخل المتصفح مع إمكانية تصديرها محليًا بواسطة المستخدم." data-en="Supported usage logs can remain in the browser and be exported locally by the user."></p></div>
    <div class="feature"><div class="iconbox">🧑‍⚕️</div><h3 data-ar="تحت تحكم الصيدلي" data-en="Pharmacist-controlled"></h3><p data-ar="CDS AutoFill مساعد لإدخال البيانات ولا يستبدل الحكم المهني ولا يتخذ قرارات الصرف." data-en="CDS AutoFill is a data-entry assistant. It does not replace professional judgment or make dispensing decisions."></p></div>

<section id="privacy">
  <h2 class="section-title" data-ar="الخصوصية من أساس التصميم" data-en="Privacy by design"></h2>
  <div class="notice" data-ar="أسماء المرضى ومعرّفاتهم وتشخيصاتهم وتفاصيل الوصفات مصممة لتبقى على جهاز الصيدلي أثناء الاستخدام الطبيعي. قد يرسل نظام الترخيص التجاري معلومات متعلقة بالترخيص فقط، مثل مفتاح الترخيص ومعرّف تثبيت عشوائي وإصدار الإضافة وحالة الترخيص. ولا تُرسل بيانات المرضى أو الوصفات ضمن طلبات الترخيص." data-en="Patient names, identifiers, diagnoses and prescription details are intended to stay on the pharmacist's device during normal use. A commercial licensing system may transmit only licensing-related information such as a license key, installation identifier, extension version and license status. It must not receive patient or prescription data."></div>
</section>
