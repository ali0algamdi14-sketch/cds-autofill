<section class="privacy-hero"><span class="section-kicker" data-ar="الخصوصية" data-en="Privacy"></span><h1 class="privacy-title"><span data-ar="سياسة الخصوصية" data-en="Privacy Policy"></span></h1><p class="lead" data-ar="آخر تحديث: 11 سبتمبر 2026" data-en="Last updated: 11 September 2026"></p></section>
<div class="policy-list">
<article class="feature policy"><h3 data-ar="1. ما الذي يفعله CDS AutoFill؟" data-en="1. What CDS AutoFill does"></h3><p data-ar="CDS AutoFill إضافة للمتصفح تساعد الصيادلة في إدخال بيانات الوصفات. تحلل نص الوصفة محليًا، وتعرض خطوة للمراجعة، ويمكنها تعبئة الحقول المدعومة بعد تأكيد الصيدلي." data-en="CDS AutoFill is a browser extension that assists pharmacists with prescription data entry. It parses prescription text locally, displays a review step, and can populate supported fields after pharmacist confirmation."></p></article>
<article class="feature policy"><h3 data-ar="2. بيانات المريض والوصفة" data-en="2. Patient and prescription data"></h3><p data-ar="تتم معالجة أسماء المرضى ومعرّفاتهم والتشخيصات ومعرّفات الوصفات ومعلومات الطبيب وتفاصيل الأدوية ومحتوى الوصفة الآخر محليًا على جهاز المستخدم أثناء التشغيل الطبيعي. CDS AutoFill غير مصمم لإرسال هذه المعلومات إلى خادم خارجي لمعالجة الوصفات." data-en="Patient names, patient identifiers, diagnoses, prescription identifiers, physician information, medication details and other prescription content are processed locally on the user's device during normal operation. CDS AutoFill is not designed to transmit this information to an external prescription-processing server."></p></article>
<article class="feature policy"><h3 data-ar="3. التخزين المحلي" data-en="3. Local storage"></h3><p data-ar="قد تخزن الإضافة سجلات التشغيل والإعدادات محليًا داخل المتصفح، ويمكن للمستخدم تصدير السجلات المدعومة محليًا. وتبقى بيانات المتصفح المحلية خاضعة لإعدادات أمان الجهاز وملف المتصفح." data-en="The extension may store operational logs and settings locally in the browser. Users may export supported logs locally. Local browser data remains subject to the browser profile and device security controls."></p></article>
<article class="feature policy"><h3 data-ar="4. الترخيص" data-en="4. Licensing"></h3><p data-ar="قد تستخدم النسخة التجارية خدمة ترخيص خارجية. وقد تتضمن طلبات الترخيص مفتاح الترخيص ومعرّف تثبيت عشوائيًا وإصدار الإضافة وحالة الترخيص. لا تُضمّن بيانات المرضى أو الوصفات في طلبات الترخيص." data-en="A commercial version may use an external licensing provider. Licensing requests may include a license key, a randomly generated installation identifier, extension version and license status. Patient and prescription data must not be included in licensing requests."></p></article>
<article class="feature policy"><h3 data-ar="5. المسؤولية المهنية" data-en="5. Professional responsibility"></h3><p data-ar="CDS AutoFill مساعد لإدخال البيانات ولا يتخذ قرارات الصرف. يتحمل الصيدلي مسؤولية مراجعة معلومات الوصفة والتأكد من دقتها والالتزام بالأنظمة والمعايير المهنية وإجراءات المنشأة المعمول بها." data-en="CDS AutoFill is a data-entry assistant and does not make dispensing decisions. Pharmacists are responsible for reviewing prescription information, confirming accuracy and complying with applicable laws, professional standards and institutional procedures."></p></article>
<article class="feature policy"><h3 data-ar="6. خدمات الأطراف الثالثة" data-en="6. Third-party services"></h3><p data-ar="إذا تم تفعيل خدمات الترخيص أو الدفع، فقد تعالج تلك الجهات معلومات الترخيص أو المعاملة وفق سياسات الخصوصية الخاصة بها. ويجب أن يقلل CDS AutoFill البيانات المشتركة معها إلى الحد المطلوب فقط لعمليات الترخيص أو الدفع." data-en="If licensing or payment services are enabled, those providers may process licensing or transaction information under their own privacy terms. CDS AutoFill should minimize data shared with such services to what is required for licensing or payment operations."></p></article>
<article class="feature policy"><h3 data-ar="7. عدم الارتباط بالجهات الحكومية" data-en="7. Government affiliation"></h3><p data-ar="CDS AutoFill برنامج مستقل وليس تابعًا أو معتمدًا أو منتجًا رسميًا لهيئة الغذاء والدواء السعودية (SFDA) أو رقيب أو أي جهة حكومية." data-en="CDS AutoFill is independent software and is not affiliated with, endorsed by, or an official product of SFDA, Raqeeb, or any government authority."></p></article>
<article class="feature policy"><h3 data-ar="8. التواصل" data-en="8. Contact"></h3><p data-ar="سيتم توفير معلومات التواصل للاستفسارات المتعلقة بالخصوصية أو الدعم في صفحة التوزيع الرسمية قبل الإطلاق التجاري العام." data-en="For privacy or support inquiries, contact information will be provided on the official distribution page before public commercial release."></p></article>
